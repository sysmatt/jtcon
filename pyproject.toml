[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "jtcon"
dynamic = ["version"]
description = "Full-screen TUI monitor for WSJT-X: CQ calls enriched with DXCC/zone info, NEEDED alerts from your ADIF log, and one-key replies"
readme = "README.md"
requires-python = ">=3.11"   # tomllib
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matt Hoskins", email = "matthoskins@gmail.com" }]
keywords = ["wsjt-x", "ft8", "ft4", "ham radio", "amateur radio", "dxcc", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = ["prompt-toolkit>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sysmatt/jtcon"
Issues = "https://github.com/sysmatt/jtcon/issues"

[project.scripts]
jtcon = "jtcon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version comes from git: the latest vX.Y.Z tag, plus .postN for N commits
# since that tag (e.g. v2.0.0 + 3 commits -> 2.0.0.post3).
[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
fallback_version = "0+unknown"   # source without git history (e.g. GitHub zip)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
