[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jtcon"
dynamic = ["version"]
description = "Full-screen TUI monitor for WSJT-X: CQ calls enriched with DXCC/zone info, NEEDED alerts from your ADIF log, and one-key replies"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matt Hoskins", email = "matthoskins@gmail.com" }]
keywords = ["wsjt-x", "ft8", "ft4", "ham radio", "amateur radio", "dxcc", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = ["prompt-toolkit>=3.0"]

[project.urls]
Homepage = "https://github.com/sysmatt/jtcon"
Issues = "https://github.com/sysmatt/jtcon/issues"

[project.scripts]
jtcon = "jtcon:main"

[tool.setuptools]
py-modules = ["jtcon"]

[tool.setuptools.dynamic]
version = { attr = "jtcon.__version__" }
